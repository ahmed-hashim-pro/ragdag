[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragdag"
version = "0.1.0"
description = "Multi-user RAG app with Airflow ingestion DAGs, pgvector and Claude."
requires-python = ">=3.12"
license = { text = "MIT" }
# Core: what the Airflow DAG tasks need. Ranges are kept compatible with the
# libraries Airflow 3.3 ships (SQLAlchemy 2.0, psycopg 3.3, pydantic 2.13).
dependencies = [
    "sqlalchemy>=2.0.40,<2.2",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.4,<0.6",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "fastembed>=0.7,<1",
    "pypdf>=5,<7",
    "beautifulsoup4>=4.12,<5",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.120,<1",
    "uvicorn[standard]>=0.34,<1",
    "alembic>=1.14,<2",
    "argon2-cffi>=23",
    "pyjwt>=2.10,<3",
    "cryptography>=44",
    "anthropic>=1.15,<2",
    "python-multipart>=0.0.20",
    "email-validator>=2.2",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ragdag = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = ["eval: retrieval quality gate over evals/ (slow: indexes a corpus, loads models)"]
filterwarnings = ["ignore::DeprecationWarning"]
